<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود لایو سکسی</title>
    <!-- اضافه کردن فونت فارسی وزیر -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary-color: #6c5ce7; /* رنگ بنفش مدرن */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --success: #00b894;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .app-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            padding-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            padding: 20px;
            text-align: center;
            color: white;
            position: relative;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .app-icon-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }

        .app-icon {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            /* عکس پیش‌فرض اگر عکس نداری، این رنگ نمایش داده میشه */
            background: #ff7675; 
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff7675;
            color: white;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 10px 0 5px;
            font-size: 22px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            display: block;
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-sub);
        }

        .install-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Vazirmatn', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .install-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        .install-btn:active {
            transform: scale(0.98);
        }

        .download-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--success);
            width: 0%;
            transition: width 0.5s ease;
        }

        .details-list {
            text-align: right;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-sub);
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .icon-download {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* انیمیشن لرزش آیکون */
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        
        .shake:hover {
            animation: shake 0.5s infinite;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header Section -->
        <div class="header">
            <div class="status-bar">
                <span>📶 4G</span>
                <span>12:55</span>
                <span>🔋 90%</span>
            </div>
            
            <div class="app-icon-wrapper shake">
                <!-- لینک عکس لوگو را اینجا عوض کن -->
                <img src="https://via.placeholder.com/150/ff7675/ffffff?text=LIVE" alt="Live Saxsi Icon" class="app-icon">
                <div class="badge">HD</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <h1>لایو سکسی</h1>
            <p class="subtitle">تماس تصویری، ساده و هیجان‌انگیز</p>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-value">۵.۰</span>
                    <span class="stat-label">امتیاز</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">۲M+</span>
                    <span class="stat-label">دانلود</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">3MB</span>
                    <span class="stat-label">حجم</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">v1.0</span>
                    <span class="stat-label">نسخه</span>
                </div>
            </div>

            <!-- Install Button -->
            <button class="install-btn" id="downloadBtn" onclick="startDownload()">
                <svg class="icon-download" viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                <span>نصب مستقیم</span>
                <div class="download-progress" id="progressBar"></div>
            </button>

            <!-- Details List -->
            <div class="details-list">
                <div class="detail-row">
                    <span>برنامه اندرویدی</span>
                    <span>✅</span>
                </div>
                <div class="detail-row">
                    <span>آخرین بروزرسانی</span>
                    <span>همین الان</span>
                </div>
                <div class="detail-row">
                    <span>تعداد نظرات</span>
                    <span>۱۰,۰۰۰</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function startDownload() {
            const btn = document.getElementById('downloadBtn');
            const bar = document.getElementById('progressBar');
            const span = btn.querySelector('span');
            
            // تغییر متن دکمه
            span.innerText = "در حال دریافت...";
            btn.style.background = "#b2bec3"; // رنگ خاکستری
            
            // شبیه‌سازی نوار پیشرفت
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    // شروع دانلود واقعی
                    window.location.href = 'https://t.me/sksksk46/2'; // <-- لینک فایل APK خودت رو اینجا بذار
                    
                    // ریست کردن دکمه بعد از چند ثانیه (اختیاری)
                    setTimeout(() => {
                        width = 0;
                        bar.style.width = '0%';
                        span.innerText = "نصب مستقیم";
                        btn.style.background = "#6c5ce7";
                    }, 2000);
                    
                } else {
                    width += 10; // سرعت پر شدن نوار
                    bar.style.width = width + '%';
                }
            }, 100);
        }
    </script>
</body>
</html>
